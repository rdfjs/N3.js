name: Refresh spec cache

on:
  schedule:
    # Weekly; the RDF 1.2 and N3 suites are still evolving.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Pin the upstream test-suite revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          paths=(
            rdf/rdf11/rdf-n-triples
            rdf/rdf11/rdf-n-quads
            rdf/rdf11/rdf-turtle
            rdf/rdf11/rdf-trig
            rdf/rdf12/rdf-n-triples/syntax
            rdf/rdf12/rdf-n-quads/syntax
            rdf/rdf12/rdf-turtle/syntax
            rdf/rdf12/rdf-trig/syntax
            rdf/rdf12/rdf-turtle/eval
            rdf/rdf12/rdf-trig/eval
            rdf/rdf12/rdf-n-triples/c14n
            rdf/rdf12/rdf-n-quads/c14n
          )
          for path in "${paths[@]}"; do
            sha=$(gh api repos/w3c/rdf-tests/commits \
              --method GET \
              -f sha=gh-pages \
              -f path="$path" \
              -F per_page=1 \
              --jq '.[0].sha')
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Bad SHA for $path: '$sha'" >&2; exit 1; }
            echo "$path $sha"
          done > spec/cache-key.txt
          sha=$(gh api 'repos/w3c-cg/N3/commits?sha=master&path=tests/N3Tests&per_page=1' --jq '.[0].sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Bad SHA for n3: '$sha'" >&2; exit 1; }
          # Pinned separately so an N3-only refresh leaves the RDF fixture caches warm.
          echo "$sha" > spec/n3-revision.txt
      - uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            spec/cache-key.txt
            spec/n3-revision.txt
          branch: ci/refresh-spec-cache
          delete-branch: true
          commit-message: 'chore(ci): refetch upstream spec suites'
          title: 'chore(ci): refetch upstream spec suites'
          body: >-
            One or more of the exact w3c/rdf-tests suites or the
            w3c-cg/N3 suites exercised by N3.js changed upstream. Merging
            updates their pinned revisions and rotates the spec jobs' fixture
            cache key so they refetch the suites cold.
