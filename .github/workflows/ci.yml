name: CI

on:
  push:
    branches:
    - main
  pull_request:
  merge_group:
    types: [checks_requested]

# Least-privilege default for GITHUB_TOKEN; jobs opt into more only where needed.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate

  build:
    # Build once on an LTS-class Node. babel 8's CLI build (@babel/code-frame ->
    # util.styleText) requires Node >= 20.12; the resulting CJS lib/ is
    # downleveled by babel and the browser bundles are esbuilt to es2017, so
    # they run everywhere. Every other job consumes this artifact instead of
    # rebuilding.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            lib
            browser
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # babel-jest require()s @babel/core, which is ESM in babel 8, so it needs
        # Node >= 20.19; jest 30 additionally needs Node >= 18.14. The full jest
        # suite transforms src/ via babel-jest at runtime, so it can only run on
        # Node 20.19+. Node 18 is covered by the spec jobs.
        node-version: [20.x, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts
      - run: npm run test

  spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]
        spec: [1-1-turtle, 1-1-ntriples, 1-1-nquads, 1-1-trig, 1-2-turtle, 1-2-ntriples, 1-2-nquads, 1-2-trig]
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts
      # Do not rebuild: the babel CLI build crashes on Node 18. spec/parser.js
      # does require('..') -> the built CJS lib/, so the downloaded artifact is
      # exactly what it needs.
      - uses: actions/download-artifact@v8
        with:
          name: build
      - uses: actions/cache@v6
        with:
          path: .rdf-test-suite-cache
          key: rdf-test-suite-cache-v1-${{ matrix.spec }}-${{ hashFiles('spec/cache-key.txt') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            rdf-test-suite-cache-v1-${{ matrix.spec }}-${{ hashFiles('spec/cache-key.txt') }}-
      - run: npm run spec-${{ matrix.spec }}

  browser:
    # Runs the built browser bundles in real engines (Chromium, Firefox,
    # WebKit) via test/browser/run.mjs. Deliberately outside the jest
    # coverage gate: it exercises the build artifacts, not src/.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node test/browser/run.mjs

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci --ignore-scripts
      - run: npm run docs
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: |
            index.html
            docs
          retention-days: 1

  summary:
    # Summary job that can be used as a single required check in branch protection
    if: always()
    needs:
      - audit
      - build
      - test
      - spec
      - browser
      - lint
      - docs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Decide whether all required jobs succeeded or failed
        # Pinned to a commit SHA: the action lives outside the actions/* org and
        # `release/v1` is a mutable branch ref.
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  gh-pages:
    needs:
      - audit
      - build
      - test
      - spec
      - docs
      - lint
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Publishing pages needs write access to contents (this job only).
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs
      # Pinned to a commit SHA: third-party action with repo write access.
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [ audit, test, spec ]
    runs-on: ubuntu-latest
    # Never run two release/publish jobs concurrently.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Emit npm build provenance (SLSA) via the workflow's id-token.
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release@25
