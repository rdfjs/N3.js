name: Enable automerge on dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# Least-privilege default; the job below widens only to what the GitHub CLI needs.
permissions:
  contents: read

jobs:
  automerge:
    name: Enable automerge on dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Check the author, so maintainer-triggered updates also enable auto-merge.
    # Never check out or execute PR code in this privileged workflow.
    if: >-
      github.repository == 'rdfjs/N3.js' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Auto-approve
        run: gh pr review "$PR_URL" --approve
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Enable auto-merge
        # The merge queue needs a PAT or GitHub App token: GITHUB_TOKEN does not
        # trigger merge_group CI, leaving queued PRs to time out (see #732).
        # Set this Actions secret to a fine-grained PAT scoped to this repo with
        # Contents: write and Pull requests: write. The queue sets the merge method.
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the DEPENDABOT_AUTOMERGE_TOKEN Actions secret to a token with Contents: write and Pull requests: write. The merge queue cannot use GITHUB_TOKEN."
            exit 1
          fi
          gh pr merge "$PR_URL" --auto --match-head-commit "$PR_HEAD_SHA"
