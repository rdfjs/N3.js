name: Sync next-major

# Rebases next-major onto main after each successful CI run on main, so the major
# branch stays main plus one commit per breaking change, and CI publishes a fresh
# alpha from it. It waits for CI, release included, so main's tags exist first.
# A conflict moves nothing: it waits for a maintainer to merge a resolution pull
# request and run apply-next-major-resolution.yml (see RELEASING.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.repository == 'rdfjs/N3.js' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    environment: next-major-sync
    # Job-level, so a run whose job is skipped (its CI failed) never enters the
    # group. At workflow level it would still replace a pending sync for a
    # green commit, and that commit would never be synced. The group is CI's
    # release group for next-major, so an alpha is never tagged on next-major
    # while it is being rebased.
    concurrency:
      group: release-refs/heads/next-major
      cancel-in-progress: false
    env:
      # A push made with GITHUB_TOKEN does not trigger CI, so next-major would
      # never release. Set this Actions secret to a fine-grained PAT for this
      # repo with Contents, Pull requests and Workflows write (main's commits
      # can change .github/workflows), owned by an actor allowed to force-push
      # to next-major.
      GH_TOKEN: ${{ secrets.NEXT_MAJOR_SYNC_TOKEN }}
      # The main commit whose CI and release succeeded. Later commits sync
      # after their own runs.
      MAIN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check the token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the NEXT_MAJOR_SYNC_TOKEN Actions secret to a token with Contents, Pull requests and Workflows write. See RELEASING.md."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.NEXT_MAJOR_SYNC_TOKEN }}
      - name: Rebase next-major onto main
        run: |
          if ! git ls-remote --exit-code --heads origin next-major > /dev/null; then
            echo "There is no next-major branch; nothing to sync."
            exit 0
          fi
          .github/scripts/next-major-sync.sh sync "$MAIN_SHA"
